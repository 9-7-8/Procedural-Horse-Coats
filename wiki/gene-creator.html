<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horse Gene Creator - 3D Surface Parametric Editor</title>
  <style>
    :root {
      --bg-dark: #0b1120;
      --panel-bg: #1e293b;
      --panel-border: #334155;
      --text-main: #f8fafc;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
      --active: #10b981;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    #app-container {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* Left Toolbox */
    #toolbox {
      width: 320px;
      background-color: var(--panel-bg);
      border-right: 1px solid var(--panel-border);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      z-index: 5;
    }

    /* Center Viewport & Canvas */
    #main-workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    #viewport-container {
      flex: 1;
      position: relative;
      background-color: var(--bg-dark);
    }

    #three-canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }

    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(11, 17, 32, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.25rem;
      font-weight: 600;
      z-index: 10;
      transition: opacity 0.3s ease;
    }

    /* Right Output Panel */
    #output-panel {
      width: 360px;
      background-color: var(--panel-bg);
      border-left: 1px solid var(--panel-border);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 5;
    }

    /* UI Components */
    .section-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .tool-group {
      background: #0f172a;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      background-color: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: #334155;
    }

    .btn-secondary:hover {
      background-color: #475569;
    }

    .btn.active {
      background-color: var(--active);
    }

    label {
      font-size: 0.8rem;
      color: #cbd5e1;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    input[type="range"], input[type="color"], select, input[type="number"], input[type="text"] {
      background: #1e293b;
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      border-radius: 4px;
      padding: 4px;
    }

    .canvas-container {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 6;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    #coat-canvas {
      width: 256px;
      height: 256px;
      image-rendering: pixelated;
      background-color: #1e293b;
      border: 1px solid var(--panel-border);
    }

    #json-output {
      flex: 1;
      background: #0f172a;
      color: #38bdf8;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 12px;
      font-family: monospace;
      font-size: 0.75rem;
      resize: none;
      white-space: pre-wrap;
    }

    .mode-indicator {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--panel-border);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #38bdf8;
      pointer-events: none;
      z-index: 6;
    }
  </style>

  <!-- Three.js Dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div id="app-container">
    
    <!-- LEFT TOOLBOX -->
    <div id="toolbox">
      <h2>3D Gene Editor</h2>

      <div class="tool-group">
        <div class="section-title">Gene Definition</div>
        <label>Gene Identifier
          <input type="text" id="gene-id" value="gene_cross_body_stripe" />
        </label>
        <label>Phenotype Frequency
          <input type="range" id="gene-frequency" min="0" max="1" step="0.01" value="0.45" />
        </label>
      </div>

      <div class="tool-group">
        <div class="section-title">Placement Mode</div>
        <button class="btn active" id="btn-mode-placement">Click 3D Mesh to Place Points</button>
        <button class="btn btn-secondary" id="btn-clear-points">Clear Current Curve</button>
      </div>

      <div class="tool-group">
        <div class="section-title">Shape Type & Scale</div>
        <label>Marking Type
          <select id="shape-type">
            <option value="BEZIER">Bézier Spline</option>
            <option value="ELLIPSE">Parametric Ellipse</option>
          </select>
        </label>
        <label>Min Expression Scale
          <input type="range" id="shape-min-scale" min="0.1" max="2.0" step="0.05" value="0.5" />
        </label>
        <label>Max Expression Scale
          <input type="range" id="shape-max-scale" min="0.1" max="2.0" step="0.05" value="1.2" />
        </label>
      </div>

      <div class="tool-group">
        <div class="section-title">Color Range & Gradient</div>
        <label>Color Start
          <input type="color" id="color-start" value="#ffffff" />
        </label>
        <label>Color End
          <input type="color" id="color-end" value="#e2e8f0" />
        </label>
        <label>Gradient Mode
          <select id="gradient-mode">
            <option value="LINEAR">Linear</option>
            <option value="RADIAL">Radial</option>
            <option value="SOLID">Solid</option>
          </select>
        </label>
      </div>
    </div>

    <!-- MAIN WORKSPACE -->
    <div id="main-workspace">
      <div id="viewport-container">
        <div class="mode-indicator" id="mode-text">Click on 3D Model to Add Curve Control Points</div>
        <div id="loading-overlay">Loading 3D Gene Preview...</div>
        <canvas id="three-canvas"></canvas>
      </div>

      <!-- Live 2D UV Canvas Overlay -->
      <div class="canvas-container">
        <div class="section-title" style="margin:0;">UV Texture Assembly Map</div>
        <canvas id="coat-canvas" width="128" height="128"></canvas>
      </div>
    </div>

    <!-- RIGHT OUTPUT PANEL -->
    <div id="output-panel">
      <h2>Parametric Gene JSON</h2>
      <div class="section-title">Generated Cross-Part Definition</div>
      <textarea id="json-output" readonly></textarea>
      <button class="btn" id="btn-copy-json">Copy JSON</button>
    </div>

  </div>

  <script>
    // --- 1. Configuration & Geometry Mapping Data ---
    const MODEL_PATH = 'horse.glb'; 
    const BASE_TEXTURE_PATH = 'common/src/main/resources/assets/horsegenetics/textures/entity/horse/horse_white.png';
    const SHEET_SIZE = 128;

    // UV Sub-Rectangles (Normalized 0.0 - 1.0 UV mapping relative to 128x128 sheet)
    const PART_BOUNDS = {
      BODY: { tu: 0, tv: 64, w: 44, h: 20 },
      NECK: { tu: 0, tv: 70, w: 14, h: 24 },
      HEAD: { tu: 0, tv: 26, w: 14, h: 10 },
      LEFT_FRONT_LEG: { tu: 52, tv: 32, w: 8, h: 22 },
      RIGHT_FRONT_LEG: { tu: 96, tv: 0, w: 8, h: 22 },
      LEFT_HIND_LEG: { tu: 52, tv: 0, w: 8, h: 22 },
      RIGHT_HIND_LEG: { tu: 96, tv: 42, w: 8, h: 22 }
    };

    // Raw 3D placement nodes placed on the mesh
    const surfaceNodes = [];

    const geneState = {
      geneId: "gene_cross_body_stripe",
      frequency: 0.45,
      curves: []
    };

    // Helper: Identify body part from absolute pixel UV coordinates on sheet
    function getPartFromUV(u, v) {
      const px = u * SHEET_SIZE;
      const py = (1 - v) * SHEET_SIZE; // Invert V for standard canvas coordinates

      for (const [partName, b] of Object.entries(PART_BOUNDS)) {
        if (px >= b.tu && px <= b.tu + b.w && py >= b.tv && py <= b.tv + b.h) {
          return {
            part: partName,
            localX: (px - b.tu) / b.w,
            localY: (py - b.tv) / b.h
          };
        }
      }
      return { part: "BODY", localX: px / SHEET_SIZE, localY: py / SHEET_SIZE };
    }

    // --- 2. 2D Interactive Canvas Editor ---
    const texCanvas = document.getElementById('coat-canvas');
    const ctx = texCanvas.getContext('2d');

    const horseTexture = new THREE.CanvasTexture(texCanvas);
    horseTexture.magFilter = THREE.NearestFilter;
    horseTexture.minFilter = THREE.NearestFilter;
    horseTexture.wrapS = THREE.ClampToEdgeWrapping;
    horseTexture.wrapT = THREE.ClampToEdgeWrapping;
    horseTexture.flipY = true;

    // Create a procedural texture as fallback
    function createProceduralTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const c = canvas.getContext('2d');
      
      // Base color - horse-like tan/brown
      c.fillStyle = '#8B7355';
      c.fillRect(0, 0, 128, 128);
      
      // Add some variation
      for (let i = 0; i < 500; i++) {
        const x = Math.random() * 128;
        const y = Math.random() * 128;
        const brightness = 70 + Math.random() * 60;
        c.fillStyle = `rgb(${brightness}, ${brightness * 0.8}, ${brightness * 0.6})`;
        c.fillRect(x, y, 2, 2);
      }
      
      // Add a subtle grid
      c.strokeStyle = 'rgba(255,255,255,0.05)';
      c.lineWidth = 0.5;
      for (let i = 0; i < 128; i += 16) {
        c.beginPath();
        c.moveTo(i, 0);
        c.lineTo(i, 128);
        c.stroke();
        c.beginPath();
        c.moveTo(0, i);
        c.lineTo(128, i);
        c.stroke();
      }
      
      return canvas;
    }

    const baseImg = new Image();
    let isBaseImgLoaded = false;
    let textureLoadError = false;
    let proceduralTexture = null;
    
    // Create procedural texture immediately
    proceduralTexture = createProceduralTexture();
    
    // Handle texture loading with proper error handling
    baseImg.crossOrigin = 'anonymous';
    baseImg.src = BASE_TEXTURE_PATH;
    baseImg.onload = () => {
      isBaseImgLoaded = true;
      textureLoadError = false;
      console.log('Texture loaded successfully:', BASE_TEXTURE_PATH);
      render2DCanvas();
      if (horseMesh) {
        horseMesh.material.map = horseTexture;
        horseMesh.material.needsUpdate = true;
      }
    };
    baseImg.onerror = (e) => {
      textureLoadError = true;
      console.warn('Could not load texture:', BASE_TEXTURE_PATH, e);
      // Use procedural texture
      horseTexture.image = proceduralTexture;
      horseTexture.needsUpdate = true;
      if (horseMesh) {
        horseMesh.material.map = horseTexture;
        horseMesh.material.needsUpdate = true;
      }
      render2DCanvas();
    };

    function render2DCanvas() {
      // Clear canvas
      ctx.clearRect(0, 0, SHEET_SIZE, SHEET_SIZE);
      
      if (isBaseImgLoaded) {
        ctx.drawImage(baseImg, 0, 0, SHEET_SIZE, SHEET_SIZE);
      } else if (proceduralTexture) {
        ctx.drawImage(proceduralTexture, 0, 0, SHEET_SIZE, SHEET_SIZE);
      } else {
        // Draw a checkerboard pattern as fallback
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(0, 0, SHEET_SIZE, SHEET_SIZE);
        
        for (let i = 0; i < SHEET_SIZE; i += 16) {
          for (let j = 0; j < SHEET_SIZE; j += 16) {
            if ((i + j) % 32 === 0) {
              ctx.fillStyle = '#2a3a5a';
              ctx.fillRect(i, j, 16, 16);
            }
          }
        }
      }

      // Draw UV Part Outlines
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 1;
      for (const [partName, b] of Object.entries(PART_BOUNDS)) {
        ctx.strokeRect(b.tu, b.tv, b.w, b.h);
        // Label parts
        ctx.fillStyle = '#94a3b8';
        ctx.font = '6px sans-serif';
        ctx.fillText(partName.substring(0, 4), b.tu + 2, b.tv + 8);
      }

      // Render 3D Surface Control Points onto the UV map
      if (surfaceNodes.length > 0) {
        ctx.beginPath();
        surfaceNodes.forEach((node, i) => {
          const px = node.uv.x * SHEET_SIZE;
          const py = (1 - node.uv.y) * SHEET_SIZE;

          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);

          // Draw node marker
          ctx.fillStyle = '#ef4444';
          ctx.beginPath();
          ctx.arc(px, py, 3, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      horseTexture.needsUpdate = true;
      compileGeneJSON();
    }

    // --- 3. Three.js & 3D Raycasting Viewport ---
    const viewport = document.getElementById('viewport-container');
    const loadingOverlay = document.getElementById('loading-overlay');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b1120);

    const camera = new THREE.PerspectiveCamera(45, viewport.clientWidth / viewport.clientHeight, 0.1, 1000);
    camera.position.set(0, 1.5, 5.0);

    const renderer = new THREE.WebGLRenderer({ 
      canvas: document.getElementById('three-canvas'), 
      antialias: true 
    });
    renderer.setSize(viewport.clientWidth, viewport.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    if (THREE.SRGBColorSpace) {
      renderer.outputColorSpace = THREE.SRGBColorSpace;
    } else if (renderer.outputEncoding !== undefined) {
      renderer.outputEncoding = THREE.sRGBEncoding;
    }

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 0, 0);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);
    const hemisphereLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
    scene.add(hemisphereLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(5, 12, 7);
    scene.add(dirLight);
    const backLight = new THREE.DirectionalLight(0x8888ff, 0.3);
    backLight.position.set(-5, 0, -5);
    scene.add(backLight);

    // Add a subtle grid helper
    const gridHelper = new THREE.GridHelper(3, 10, 0x334155, 0x1e293b);
    gridHelper.position.y = -1.2;
    scene.add(gridHelper);

    const horseMaterial = new THREE.MeshStandardMaterial({ 
      map: horseTexture,
      roughness: 0.7,
      metalness: 0.05,
      side: THREE.DoubleSide
    });

    let horseMesh = null;
    let horseModel = null;
    const visualNodesGroup = new THREE.Group();
    scene.add(visualNodesGroup);

    // GLTF Model Loading with better error handling
    const gltfLoader = new THREE.GLTFLoader();
    console.log('Attempting to load model:', MODEL_PATH);
    
    // Try loading with GLTFLoader directly (simpler)
    gltfLoader.load(
      MODEL_PATH,
      (gltf) => {
        horseModel = gltf.scene;
        console.log('Model loaded successfully');
        
        horseModel.traverse((child) => {
          if (child.isMesh) {
            child.material = horseMaterial;
            horseMesh = child;
            console.log('Found mesh in model:', child.name);
          }
        });

        if (!horseMesh) {
          console.warn('No mesh found in model, creating fallback');
          createFallbackModel();
        } else {
          const box = new THREE.Box3().setFromObject(horseModel);
          const center = box.getCenter(new THREE.Vector3());
          const size = box.getSize(new THREE.Vector3());
          const maxDim = Math.max(size.x, size.y, size.z);
          horseModel.position.sub(center);
          
          // Scale if needed
          if (maxDim > 2.5) {
            const scale = 2.0 / maxDim;
            horseModel.scale.set(scale, scale, scale);
          }

          scene.add(horseModel);
          loadingOverlay.style.opacity = '0';
          setTimeout(() => loadingOverlay.style.display = 'none', 300);
          
          // If texture was already loaded, update material
          if (isBaseImgLoaded || proceduralTexture) {
            horseMesh.material.map = horseTexture;
            horseMesh.material.needsUpdate = true;
          }
        }
      },
      (xhr) => {
        // Progress
        const percent = Math.floor((xhr.loaded / xhr.total) * 100);
        if (xhr.total > 0) {
          loadingOverlay.textContent = `Loading 3D Gene Preview... ${percent}%`;
        }
      },
      (err) => {
        console.error('Failed loading 3D model:', err);
        loadingOverlay.innerText = '3D Preview Unavailable - Using Fallback';
        loadingOverlay.style.color = '#ef4444';
        
        createFallbackModel();
        
        setTimeout(() => {
          loadingOverlay.style.opacity = '0';
          setTimeout(() => loadingOverlay.style.display = 'none', 300);
        }, 1000);
      }
    );

    // Create a fallback model if GLB can't load
    function createFallbackModel() {
      console.log('Creating fallback model');
      // Create a simple horse-like shape using geometry
      const geometry = new THREE.CylinderGeometry(0.8, 0.6, 2.0, 16);
      const mesh = new THREE.Mesh(geometry, horseMaterial);
      mesh.position.y = 0.2;
      horseMesh = mesh;
      horseModel = mesh;
      scene.add(mesh);
      
      // Add a head
      const headGeo = new THREE.SphereGeometry(0.3, 8, 8);
      const headMat = new THREE.MeshStandardMaterial({ color: 0x8B7355 });
      const head = new THREE.Mesh(headGeo, headMat);
      head.position.set(0, 0.8, -0.3);
      head.scale.set(0.7, 0.5, 0.8);
      mesh.add(head);
      
      // Add legs
      const legGeo = new THREE.CylinderGeometry(0.08, 0.1, 0.6, 6);
      const legMat = new THREE.MeshStandardMaterial({ color: 0x7A6548 });
      for (let i = -1; i <= 1; i += 2) {
        for (let j = -1; j <= 1; j += 2) {
          const leg = new THREE.Mesh(legGeo, legMat);
          leg.position.set(i * 0.3, -0.6, j * 0.4);
          leg.rotation.x = 0.2;
          mesh.add(leg);
        }
      }
      
      loadingOverlay.style.opacity = '0';
      setTimeout(() => loadingOverlay.style.display = 'none', 300);
    }

    // 3D Direct Surface Interaction (Raycasting)
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };

    renderer.domElement.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      isDragging = false;
      dragStart.x = e.clientX;
      dragStart.y = e.clientY;
    });

    renderer.domElement.addEventListener('pointermove', (e) => {
      if (e.buttons === 1) {
        const dx = e.clientX - dragStart.x;
        const dy = e.clientY - dragStart.y;
        if (Math.sqrt(dx*dx + dy*dy) > 5) {
          isDragging = true;
        }
      }
    });

    renderer.domElement.addEventListener('pointerup', (e) => {
      if (e.button !== 0) return;
      if (isDragging) return;

      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      
      // Get all objects that can be intersected
      const objects = [];
      scene.traverse((child) => {
        if (child.isMesh) {
          objects.push(child);
        }
      });
      
      const intersects = raycaster.intersectObjects(objects, false);

      if (intersects.length > 0) {
        const hit = intersects[0];
        if (hit.uv) {
          // Store point with world, UV, and part metadata
          const partInfo = getPartFromUV(hit.uv.x, hit.uv.y);
          surfaceNodes.push({
            point3D: hit.point.clone(),
            uv: hit.uv.clone(),
            partInfo: partInfo
          });

          // Add visual 3D sphere marker on the horse's surface
          const markerGeo = new THREE.SphereGeometry(0.04, 16, 16);
          const markerMat = new THREE.MeshBasicMaterial({ color: 0xef4444 });
          const marker = new THREE.Mesh(markerGeo, markerMat);
          marker.position.copy(hit.point);
          visualNodesGroup.add(marker);

          render2DCanvas();
          console.log('Point added at UV:', hit.uv.x, hit.uv.y, 'Part:', partInfo.part);
        } else {
          console.warn('Clicked point has no UV data - try clicking on a different part of the model');
          // Show temporary visual feedback
          loadingOverlay.textContent = '⚠️ No UV data at this point - try another area';
          loadingOverlay.style.color = '#fbbf24';
          loadingOverlay.style.opacity = '1';
          setTimeout(() => {
            loadingOverlay.style.opacity = '0';
            setTimeout(() => {
              loadingOverlay.style.display = 'none';
            }, 300);
          }, 1500);
        }
      }
    });

    // --- 4. JSON Generation ---
    const jsonOutput = document.getElementById('json-output');

    function compileGeneJSON() {
      // Group points by targeted body parts automatically
      const curveSegments = [];
      let currentPart = null;
      let currentSegment = null;

      surfaceNodes.forEach(node => {
        const pInfo = node.partInfo;
        if (pInfo.part !== currentPart) {
          currentPart = pInfo.part;
          currentSegment = {
            part: currentPart,
            type: document.getElementById('shape-type').value,
            expression: {
              minScale: parseFloat(document.getElementById('shape-min-scale').value),
              maxScale: parseFloat(document.getElementById('shape-max-scale').value)
            },
            color: {
              start: document.getElementById('color-start').value,
              end: document.getElementById('color-end').value,
              gradient: document.getElementById('gradient-mode').value
            },
            points: []
          };
          curveSegments.push(currentSegment);
        }

        currentSegment.points.push({
          x: parseFloat(pInfo.localX.toFixed(3)),
          y: parseFloat(pInfo.localY.toFixed(3))
        });
      });

      geneState.geneId = document.getElementById('gene-id').value;
      geneState.frequency = parseFloat(document.getElementById('gene-frequency').value);
      geneState.curves = curveSegments;
      jsonOutput.value = JSON.stringify(geneState, null, 2);
    }

    // UI Clear Button Event
    document.getElementById('btn-clear-points').addEventListener('click', () => {
      surfaceNodes.length = 0;
      while (visualNodesGroup.children.length > 0) {
        visualNodesGroup.remove(visualNodesGroup.children[0]);
      }
      render2DCanvas();
    });

    document.getElementById('btn-copy-json').addEventListener('click', () => {
      navigator.clipboard.writeText(jsonOutput.value).catch(() => {
        // Fallback if clipboard API fails
        jsonOutput.select();
        document.execCommand('copy');
        alert('Gene JSON copied to clipboard!');
      });
      alert('Gene JSON copied to clipboard!');
    });

    // Update JSON when UI controls change
    document.querySelectorAll('#toolbox input, #toolbox select').forEach(el => {
      el.addEventListener('change', compileGeneJSON);
      el.addEventListener('input', compileGeneJSON);
    });

    // --- 5. Render Loop ---
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    // Initial render
    render2DCanvas();
    animate();

    window.addEventListener('resize', () => {
      const width = viewport.clientWidth;
      const height = viewport.clientHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    });

    console.log('Horse Gene Creator initialized');
    console.log('Looking for files:', { MODEL_PATH, BASE_TEXTURE_PATH });
  </script>
</body>
</html>
