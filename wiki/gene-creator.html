<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Horse Gene Editor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; height: 100vh; overflow: hidden; }
    
    #sidebar { width: 380px; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; padding: 15px; gap: 15px; overflow-y: auto; flex-shrink: 0; }
    #viewport-container { flex: 1; position: relative; display: flex; background: #0b1120; }
    #canvas-2d-container { width: 320px; background: #1e293b; border-left: 1px solid #334155; padding: 15px; display: flex; flex-direction: column; align-items: center; gap: 10px; flex-shrink: 0; }
    
    h2, h3 { color: #38bdf8; font-size: 1.1rem; }
    .section { background: #0f172a; padding: 12px; border-radius: 6px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 8px; }
    label { font-size: 0.85rem; color: #94a3b8; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    input, select, button { background: #1e293b; border: 1px solid #475569; color: #fff; padding: 6px 10px; border-radius: 4px; font-size: 0.85rem; }
    input[type="number"] { width: 80px; }
    input[type="color"] { width: 50px; height: 34px; padding: 2px; cursor: pointer; }
    button { cursor: pointer; background: #10b981; border: none; font-weight: bold; color: #fff; padding: 8px; border-radius: 4px; transition: all 0.2s; }
    button:hover { background: #059669; transform: scale(1.02); }
    button.secondary { background: #38bdf8; color: #0f172a; }
    button.secondary:hover { background: #0ea5e9; }
    button.danger { background: #ef4444; }
    button.danger:hover { background: #dc2626; }
    
    .layer-item { background: #1e293b; padding: 8px; border-radius: 4px; border: 1px solid #334155; margin-bottom: 6px; font-size: 0.85rem; }
    .layer-item .controls { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
    .layer-item button { padding: 2px 6px; font-size: 0.7rem; }
    #textureCanvas { border: 1px solid #475569; background: #fff; width: 256px; height: 256px; image-rendering: pixelated; cursor: crosshair; }
    #three-canvas { width: 100%; height: 100%; display: block; }
    #loading-overlay { position: absolute; top: 10px; left: 10px; background: rgba(15, 23, 42, 0.9); color: #38bdf8; padding: 8px 16px; border-radius: 4px; font-size: 0.8rem; border: 1px solid #334155; z-index: 10; }
    
    .curve-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    .curve-controls label { font-size: 0.75rem; }
    
    /* Scrollbar styling */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>

  <!-- Import Three.js, OrbitControls, and GLTFLoader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <!-- Left Sidebar: Gene Controls -->
  <div id="sidebar">
    <h2>Gene Editor</h2>
    
    <div class="section">
      <label>Gene Key / Identifier:
        <input type="text" id="geneName" value="gene_dappled_grey">
      </label>
      <label>Base Texture Overlay Tint:
        <input type="color" id="tintColor" value="#ffffff">
      </label>
    </div>

    <div class="section">
      <h3>Add Marking Layer</h3>
      <label>Shape Tool:
        <select id="toolType">
          <option value="ellipse">Ellipse / Dapple Spot</option>
          <option value="bezier">Bezier Curve</option>
          <option value="polygon">Polygon / Patch</option>
        </select>
      </label>
      
      <div id="bezierControls" style="display:none;">
        <div class="curve-controls">
          <label>Min Thickness: <input type="number" id="minThickness" value="2" min="1" max="50"></label>
          <label>Max Thickness: <input type="number" id="maxThickness" value="8" min="1" max="50"></label>
          <label>Curve Points: <input type="number" id="curvePoints" value="5" min="3" max="20"></label>
          <label>Handle Spread: <input type="number" id="handleSpread" value="20" min="5" max="100"></label>
        </div>
      </div>
      
      <div id="shapeControls">
        <label>Min Size (px): <input type="number" id="minSize" value="4" min="1" max="256"></label>
        <label>Max Size (px): <input type="number" id="maxSize" value="16" min="1" max="256"></label>
        <label>Frequency (Count): <input type="number" id="frequency" value="30" min="1" max="1000"></label>
      </div>
      
      <label>Primary Pigment: <input type="color" id="primaryColor" value="#333333"></label>
      <label>Secondary Pigment: <input type="color" id="secondaryColor" value="#888888"></label>
      
      <button id="addLayerBtn">Add Layer to Gene</button>
    </div>

    <div class="section">
      <h3>Active Marking Layers</h3>
      <div id="layersList"></div>
    </div>

    <button id="exportGeneBtn" class="secondary">Export Gene JSON</button>
    <button id="clearAllBtn" class="danger">Clear All Layers</button>
  </div>

  <!-- Center Viewport: 3D Minecraft Horse Model -->
  <div id="viewport-container">
    <div id="loading-overlay">Loading horse.glb...</div>
    <canvas id="three-canvas"></canvas>
  </div>

  <!-- Right Sidebar: 2D Texture Map Target -->
  <div id="canvas-2d-container">
    <h3>Coat Build Surface</h3>
    <canvas id="textureCanvas" width="256" height="256"></canvas>
    <div style="display:flex; gap:10px; font-size:0.75rem; color:#94a3b8;">
      <span>● Click to add control points</span>
      <span>━ Curve path</span>
    </div>
    <div id="curvePointStatus" style="font-size:0.7rem; color:#38bdf8;">0 points placed</div>
  </div>

  <script>
    const WHITE_BASE_TEXTURE_PATH = 'horse_white.png';
    const MODEL_PATH = 'horse.glb';

    // --- 1. Gene Data Model ---
    let geneDefinition = {
      id: "gene_dappled_grey",
      tintColor: "#ffffff",
      layers: []
    };

    // --- 2. Canvas & Base Texture Loading ---
    const texCanvas = document.getElementById('textureCanvas');
    const ctx = texCanvas.getContext('2d');
    
    // Curve drawing state
    let curvePoints = [];
    let isDrawingCurve = false;
    let currentLayerType = 'bezier';
    
    // Load default white base texture
    const baseImg = new Image();
    baseImg.crossOrigin = "anonymous";
    baseImg.src = WHITE_BASE_TEXTURE_PATH;
    baseImg.onload = () => {
      texCanvas.width = Math.min(baseImg.width || 256, 512);
      texCanvas.height = Math.min(baseImg.height || 256, 512);
      renderTexture();
    };
    baseImg.onerror = () => {
      console.warn(`Could not load ${WHITE_BASE_TEXTURE_PATH}, using fallback.`);
      texCanvas.width = 256;
      texCanvas.height = 256;
      renderTexture();
    };

    function renderTexture() {
      // Clear canvas
      ctx.clearRect(0, 0, texCanvas.width, texCanvas.height);
      
      // Draw white base texture image or fallback background
      if (baseImg.complete && baseImg.naturalWidth !== 0) {
        ctx.drawImage(baseImg, 0, 0, texCanvas.width, texCanvas.height);
      } else {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, texCanvas.width, texCanvas.height);
        
        // Draw a subtle grid for reference
        ctx.strokeStyle = "rgba(200,200,200,0.3)";
        ctx.lineWidth = 0.5;
        for (let i = 0; i < texCanvas.width; i += 16) {
          ctx.beginPath();
          ctx.moveTo(i, 0);
          ctx.lineTo(i, texCanvas.height);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, i);
          ctx.lineTo(texCanvas.width, i);
          ctx.stroke();
        }
      }

      // Apply tint overlay
      if (geneDefinition.tintColor && geneDefinition.tintColor !== "#ffffff") {
        ctx.fillStyle = geneDefinition.tintColor;
        ctx.globalCompositeOperation = "multiply";
        ctx.fillRect(0, 0, texCanvas.width, texCanvas.height);
        ctx.globalCompositeOperation = "source-over";
      }

      // Render marking layers
      geneDefinition.layers.forEach(layer => {
        if (layer.type === 'bezier' && layer.points && layer.points.length >= 2) {
          drawBezierLayer(layer);
        } else if (layer.type === 'ellipse') {
          drawEllipseLayer(layer);
        } else if (layer.type === 'polygon') {
          drawPolygonLayer(layer);
        }
      });

      // Draw curve points if in bezier mode
      if (currentLayerType === 'bezier' && curvePoints.length > 0) {
        drawCurvePoints();
      }

      if (horseTexture) horseTexture.needsUpdate = true;
    }

    function drawBezierLayer(layer) {
      const points = layer.points;
      const thickness = layer.thickness || 4;
      
      ctx.save();
      
      // Draw the curve path
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      
      // Draw bezier curve through points
      for (let i = 0; i < points.length - 1; i++) {
        const p0 = points[i];
        const p1 = points[i + 1];
        
        // Calculate control points with handle spread
        const spread = layer.handleSpread || 20;
        const dx = p1.x - p0.x;
        const dy = p1.y - p0.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        if (dist > 0) {
          const handleLen = Math.min(dist * 0.3, spread);
          const angle = Math.atan2(dy, dx);
          
          // Perpendicular offset for handle
          const perpAngle = angle + Math.PI / 2;
          const offset = (layer.handleOffset || 0) * (i % 2 === 0 ? 1 : -1);
          
          const cp1x = p0.x + Math.cos(angle) * handleLen + Math.cos(perpAngle) * offset;
          const cp1y = p0.y + Math.sin(angle) * handleLen + Math.sin(perpAngle) * offset;
          const cp2x = p1.x - Math.cos(angle) * handleLen + Math.cos(perpAngle) * offset;
          const cp2y = p1.y - Math.sin(angle) * handleLen + Math.sin(perpAngle) * offset;
          
          ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p1.x, p1.y);
        } else {
          ctx.lineTo(p1.x, p1.y);
        }
      }
      
      // Apply gradient along the curve
      const grad = ctx.createLinearGradient(
        points[0].x, points[0].y,
        points[points.length-1].x, points[points.length-1].y
      );
      grad.addColorStop(0, layer.primaryColor || '#333333');
      grad.addColorStop(1, layer.secondaryColor || '#888888');
      
      ctx.strokeStyle = grad;
      ctx.lineWidth = thickness;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();
      
      // Draw handles if in edit mode
      if (layer.showHandles) {
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.3)';
        ctx.lineWidth = 1;
        ctx.setLineDash([3, 3]);
        
        for (let i = 0; i < points.length - 1; i++) {
          const p0 = points[i];
          const p1 = points[i + 1];
          const dx = p1.x - p0.x;
          const dy = p1.y - p0.y;
          const dist = Math.sqrt(dx*dx + dy*dy);
          
          if (dist > 0) {
            const handleLen = Math.min(dist * 0.3, layer.handleSpread || 20);
            const angle = Math.atan2(dy, dx);
            const perpAngle = angle + Math.PI / 2;
            const offset = (layer.handleOffset || 0) * (i % 2 === 0 ? 1 : -1);
            
            const cp1x = p0.x + Math.cos(angle) * handleLen + Math.cos(perpAngle) * offset;
            const cp1y = p0.y + Math.sin(angle) * handleLen + Math.sin(perpAngle) * offset;
            const cp2x = p1.x - Math.cos(angle) * handleLen + Math.cos(perpAngle) * offset;
            const cp2y = p1.y - Math.sin(angle) * handleLen + Math.sin(perpAngle) * offset;
            
            // Draw handle lines
            ctx.beginPath();
            ctx.moveTo(p0.x, p0.y);
            ctx.lineTo(cp1x, cp1y);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(cp2x, cp2y);
            ctx.stroke();
            
            // Draw handle points
            ctx.fillStyle = 'rgba(56, 189, 248, 0.5)';
            ctx.beginPath();
            ctx.arc(cp1x, cp1y, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(cp2x, cp2y, 3, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        ctx.setLineDash([]);
      }
      
      ctx.restore();
      
      // Draw control points
      ctx.save();
      points.forEach(p => {
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 1.5, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();
    }

    function drawEllipseLayer(layer) {
      for (let i = 0; i < layer.frequency; i++) {
        const x = Math.random() * texCanvas.width;
        const y = Math.random() * texCanvas.height;
        const size = layer.minSize + Math.random() * (layer.maxSize - layer.minSize);

        ctx.save();
        const grad = ctx.createRadialGradient(x, y, 0, x, y, size);
        grad.addColorStop(0, layer.primaryColor);
        grad.addColorStop(1, layer.secondaryColor);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.ellipse(x, y, size, size * 0.7, Math.random() * Math.PI, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function drawPolygonLayer(layer) {
      for (let i = 0; i < layer.frequency; i++) {
        const x = Math.random() * texCanvas.width;
        const y = Math.random() * texCanvas.height;
        const size = layer.minSize + Math.random() * (layer.maxSize - layer.minSize);

        ctx.save();
        ctx.beginPath();
        const points = 5 + Math.floor(Math.random() * 3);
        for (let j = 0; j < points; j++) {
          const angle = (j / points) * Math.PI * 2 + Math.random() * 0.3;
          const r = size * (0.6 + Math.random() * 0.4);
          const px = x + Math.cos(angle) * r;
          const py = y + Math.sin(angle) * r;
          if (j === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        
        const grad = ctx.createRadialGradient(x, y, 0, x, y, size);
        grad.addColorStop(0, layer.primaryColor);
        grad.addColorStop(1, layer.secondaryColor);
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.restore();
      }
    }

    function drawCurvePoints() {
      ctx.save();
      
      // Draw connecting lines
      if (curvePoints.length > 1) {
        ctx.beginPath();
        ctx.moveTo(curvePoints[0].x, curvePoints[0].y);
        for (let i = 1; i < curvePoints.length; i++) {
          ctx.lineTo(curvePoints[i].x, curvePoints[i].y);
        }
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.5)';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.stroke();
        ctx.setLineDash([]);
      }
      
      // Draw points
      curvePoints.forEach((p, i) => {
        // Glow
        const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 8);
        grad.addColorStop(0, 'rgba(239, 68, 68, 0.3)');
        grad.addColorStop(1, 'rgba(239, 68, 68, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
        ctx.fill();
        
        // Point
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.fill();
        
        // Index
        ctx.fillStyle = '#ffffff';
        ctx.font = '8px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText(i + 1, p.x, p.y - 6);
      });
      
      ctx.restore();
      
      document.getElementById('curvePointStatus').textContent = `${curvePoints.length} points placed`;
    }

    // --- 3. Three.js 3D Viewport Setup ---
    const viewport = document.getElementById('viewport-container');
    const loadingOverlay = document.getElementById('loading-overlay');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b1120);

    const camera = new THREE.PerspectiveCamera(45, viewport.clientWidth / viewport.clientHeight, 0.1, 1000);
    camera.position.set(2, 1.8, 4.5);

    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('three-canvas'), antialias: true });
    renderer.setSize(viewport.clientWidth, viewport.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    if (THREE.SRGBColorSpace) {
      renderer.outputColorSpace = THREE.SRGBColorSpace;
    } else if (renderer.outputEncoding !== undefined) {
      renderer.outputEncoding = THREE.sRGBEncoding;
    }

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 0.8, 0);
    controls.minDistance = 1.5;
    controls.maxDistance = 8;

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);
    const hemisphereLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.5);
    scene.add(hemisphereLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);
    const fillLight = new THREE.DirectionalLight(0x8888ff, 0.3);
    fillLight.position.set(-5, 2, -5);
    scene.add(fillLight);

    // Dynamic Canvas Texture
    const horseTexture = new THREE.CanvasTexture(texCanvas);
    horseTexture.magFilter = THREE.NearestFilter;
    horseTexture.minFilter = THREE.NearestFilter;
    horseTexture.wrapS = THREE.RepeatWrapping;
    horseTexture.wrapT = THREE.RepeatWrapping;
    horseTexture.flipY = true;

    const horseMaterial = new THREE.MeshStandardMaterial({ 
      map: horseTexture,
      roughness: 0.8,
      metalness: 0.1,
      side: THREE.DoubleSide
    });

    let horseModel = null;
    let horseMesh = null;

    // Load actual horse.glb GLTF Model
    const loader = new THREE.GLTFLoader();
    console.log('Loading model from:', MODEL_PATH);
    
    loader.load(
      MODEL_PATH,
      (gltf) => {
        horseModel = gltf.scene;
        console.log('Model loaded successfully');
        
        horseModel.traverse((child) => {
          if (child.isMesh) {
            child.material = horseMaterial.clone();
            child.material.map = horseTexture;
            child.material.needsUpdate = true;
            horseMesh = child;
            console.log('Found mesh:', child.name);
          }
        });
        
        if (!horseMesh) {
          console.warn('No mesh found in model, creating fallback');
          createFallbackModel();
        } else {
          // Auto-center model
          const box = new THREE.Box3().setFromObject(horseModel);
          const center = box.getCenter(new THREE.Vector3());
          horseModel.position.sub(center);
          const size = box.getSize(new THREE.Vector3());
          const maxDim = Math.max(size.x, size.y, size.z);
          if (maxDim > 2.5) {
            const scale = 2.0 / maxDim;
            horseModel.scale.set(scale, scale, scale);
          }
          horseModel.position.y += 0.2;

          scene.add(horseModel);
          loadingOverlay.style.display = 'none';
        }
      },
      (xhr) => {
        if (xhr.lengthComputable) {
          const percent = Math.round((xhr.loaded / xhr.total) * 100);
          loadingOverlay.innerText = `Loading horse.glb... (${percent}%)`;
        }
      },
      (error) => {
        console.error('Error loading horse.glb:', error);
        loadingOverlay.innerText = 'Failed to load model - using fallback';
        loadingOverlay.style.color = '#ef4444';
        createFallbackModel();
        setTimeout(() => {
          loadingOverlay.style.display = 'none';
        }, 2000);
      }
    );

    function createFallbackModel() {
      console.log('Creating fallback model');
      const geometry = new THREE.CylinderGeometry(0.6, 0.5, 1.8, 16);
      const mesh = new THREE.Mesh(geometry, horseMaterial);
      mesh.position.y = 0.2;
      horseMesh = mesh;
      horseModel = mesh;
      scene.add(mesh);
      
      // Add simple legs
      const legGeo = new THREE.BoxGeometry(0.08, 0.4, 0.08);
      const legMat = new THREE.MeshStandardMaterial({ color: 0x8B7355 });
      const positions = [[-0.2, -0.4, -0.15], [0.2, -0.4, -0.15], [-0.2, -0.4, 0.15], [0.2, -0.4, 0.15]];
      positions.forEach(pos => {
        const leg = new THREE.Mesh(legGeo, legMat);
        leg.position.set(pos[0], 0.2 + pos[1], pos[2]);
        mesh.add(leg);
      });
      
      // Add head
      const headGeo = new THREE.SphereGeometry(0.2, 8, 8);
      const headMat = new THREE.MeshStandardMaterial({ color: 0x8B7355 });
      const head = new THREE.Mesh(headGeo, headMat);
      head.position.set(0, 0.6, -0.3);
      head.scale.set(0.7, 0.5, 0.8);
      mesh.add(head);
      
      loadingOverlay.style.display = 'none';
    }

    // --- 4. Canvas Interaction for Bezier Curve Drawing ---
    texCanvas.addEventListener('click', (e) => {
      const rect = texCanvas.getBoundingClientRect();
      const scaleX = texCanvas.width / rect.width;
      const scaleY = texCanvas.height / rect.height;
      
      const x = (e.clientX - rect.left) * scaleX;
      const y = (e.clientY - rect.top) * scaleY;
      
      if (currentLayerType === 'bezier') {
        curvePoints.push({ x, y });
        renderTexture();
      }
    });

    texCanvas.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      if (currentLayerType === 'bezier' && curvePoints.length > 1) {
        // Finish curve and add as layer
        addBezierLayer();
      }
    });

    function addBezierLayer() {
      if (curvePoints.length < 2) {
        alert('Need at least 2 points to create a curve');
        return;
      }
      
      const layer = {
        id: Date.now(),
        type: 'bezier',
        points: [...curvePoints],
        thickness: parseFloat(document.getElementById('minThickness').value) + 
          Math.random() * (parseFloat(document.getElementById('maxThickness').value) - 
          parseFloat(document.getElementById('minThickness').value)),
        handleSpread: parseFloat(document.getElementById('handleSpread').value),
        handleOffset: (Math.random() - 0.5) * 10,
        primaryColor: document.getElementById('primaryColor').value,
        secondaryColor: document.getElementById('secondaryColor').value,
        showHandles: true
      };
      
      geneDefinition.layers.push(layer);
      curvePoints = [];
      updateLayersUI();
      renderTexture();
      document.getElementById('curvePointStatus').textContent = '0 points placed';
    }

    // --- 5. UI Interactions ---
    document.getElementById('tintColor').addEventListener('input', (e) => {
      geneDefinition.tintColor = e.target.value;
      renderTexture();
    });

    document.getElementById('toolType').addEventListener('change', (e) => {
      const type = e.target.value;
      currentLayerType = type;
      
      document.getElementById('bezierControls').style.display = type === 'bezier' ? 'block' : 'none';
      document.getElementById('shapeControls').style.display = type === 'bezier' ? 'none' : 'block';
      
      if (type === 'bezier') {
        document.getElementById('curvePointStatus').style.display = 'block';
        texCanvas.style.cursor = 'crosshair';
      } else {
        document.getElementById('curvePointStatus').style.display = 'none';
        texCanvas.style.cursor = 'default';
        curvePoints = [];
        renderTexture();
      }
    });

    document.getElementById('addLayerBtn').addEventListener('click', () => {
      const type = document.getElementById('toolType').value;
      
      if (type === 'bezier') {
        addBezierLayer();
        return;
      }
      
      const layer = {
        id: Date.now(),
        type: type,
        minSize: parseFloat(document.getElementById('minSize').value),
        maxSize: parseFloat(document.getElementById('maxSize').value),
        frequency: parseInt(document.getElementById('frequency').value),
        primaryColor: document.getElementById('primaryColor').value,
        secondaryColor: document.getElementById('secondaryColor').value
      };

      geneDefinition.layers.push(layer);
      updateLayersUI();
      renderTexture();
    });

    function updateLayersUI() {
      const list = document.getElementById('layersList');
      list.innerHTML = '';
      geneDefinition.layers.forEach((layer, idx) => {
        const item = document.createElement('div');
        item.className = 'layer-item';
        const typeLabel = layer.type.toUpperCase();
        const info = layer.type === 'bezier' 
          ? `${layer.points.length} points, thickness: ${layer.thickness.toFixed(1)}px`
          : `${layer.frequency}x, size: ${layer.minSize}-${layer.maxSize}px`;
        
        item.innerHTML = `
          <strong>${idx + 1}. ${typeLabel}</strong><br>
          ${info}
          <div class="controls">
            <button class="secondary" onclick="toggleHandles(${layer.id})">Toggle Handles</button>
            <button class="danger" onclick="removeLayer(${layer.id})">Remove</button>
          </div>
        `;
        list.appendChild(item);
      });
    }

    window.toggleHandles = function(id) {
      const layer = geneDefinition.layers.find(l => l.id === id);
      if (layer && layer.type === 'bezier') {
        layer.showHandles = !layer.showHandles;
        renderTexture();
      }
    };

    window.removeLayer = function(id) {
      geneDefinition.layers = geneDefinition.layers.filter(l => l.id !== id);
      updateLayersUI();
      renderTexture();
    };

    document.getElementById('clearAllBtn').addEventListener('click', () => {
      if (confirm('Remove all layers?')) {
        geneDefinition.layers = [];
        curvePoints = [];
        updateLayersUI();
        renderTexture();
        document.getElementById('curvePointStatus').textContent = '0 points placed';
      }
    });

    // Export JSON
    document.getElementById('exportGeneBtn').addEventListener('click', () => {
      geneDefinition.id = document.getElementById('geneName').value;
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(geneDefinition, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `${geneDefinition.id}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && curvePoints.length > 0) {
        curvePoints = [];
        renderTexture();
        document.getElementById('curvePointStatus').textContent = '0 points placed';
      }
    });

    // Window Resizing
    window.addEventListener('resize', () => {
      const width = viewport.clientWidth;
      const height = viewport.clientHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    });

    // Animation Loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    // Initial setup
    document.getElementById('toolType').dispatchEvent(new Event('change'));
    renderTexture();
    animate();

    console.log('Horse Gene Editor initialized');
    console.log('Model path:', MODEL_PATH);
  </script>
</body>
</html>
