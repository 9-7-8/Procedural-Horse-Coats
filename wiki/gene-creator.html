<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horse Gene Creator</title>
  <style>
    :root {
      --bg-dark: #0b1120;
      --panel-bg: #1e293b;
      --text-main: #f8fafc;
      --accent: #3b82f6;
      --danger: #ef4444;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    #app-container {
      display: flex;
      width: 100%;
      height: 100%;
    }

    #viewport-container {
      flex: 1;
      position: relative;
      background-color: var(--bg-dark);
    }

    #three-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(11, 17, 32, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.25rem;
      font-weight: 600;
      z-index: 10;
    }

    #sidebar {
      width: 320px;
      background-color: var(--panel-bg);
      padding: 20px;
      box-shadow: -2px 0 10px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 20px;
      z-index: 5;
    }

    .canvas-preview-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    #coat-canvas {
      width: 256px;
      height: 256px;
      image-rendering: pixelated;
      background-color: #000;
      border: 2px solid #334155;
      border-radius: 4px;
    }

    .info-panel {
      font-size: 0.9rem;
      line-height: 1.5;
      color: #94a3b8;
    }
  </style>

  <!-- Three.js and GLTFLoader Dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div id="app-container">
    <div id="viewport-container">
      <div id="loading-overlay">Loading Horse Model...</div>
      <canvas id="three-canvas"></canvas>
    </div>

    <div id="sidebar">
      <h2>Gene Editor</h2>
      <div class="canvas-preview-container">
        <label>128x128 Texture Sheet</label>
        <canvas id="coat-canvas" width="128" height="128"></canvas>
      </div>
      <div class="info-panel">
        <p>Use left-click to rotate, right-click to pan, and scroll to zoom.</p>
      </div>
    </div>
  </div>

  <script>
    // --- 1. Configuration & Constants ---
    // Since this file is inside the wiki/ folder, load horse.glb from the current directory
    const MODEL_PATH = 'horse.glb'; 
    const SHEET_SIZE = 128; // Matches HorseSkinGeometry.SHEET_SIZE

    // --- 2. 2D Texture Canvas Initialization ---
    const texCanvas = document.getElementById('coat-canvas');
    texCanvas.width = SHEET_SIZE;
    texCanvas.height = SHEET_SIZE;
    const ctx = texCanvas.getContext('2d');

    // Create a base fallback pattern on the texture canvas
    function initTextureCanvas() {
      ctx.fillStyle = '#8b5a2b'; // Base chestnut color
      ctx.fillRect(0, 0, SHEET_SIZE, SHEET_SIZE);
      
      // Draw temporary grid marker to help verify UV alignment
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, 16, 16); // Top-left box
      ctx.fillStyle = '#000000';
      ctx.fillRect(SHEET_SIZE - 16, SHEET_SIZE - 16, 16, 16); // Bottom-right box
    }
    initTextureCanvas();

    // Load base horse coat image if available
    const baseImg = new Image();
    baseImg.src = 'horse_white.png';
    baseImg.onload = () => {
      ctx.drawImage(baseImg, 0, 0, SHEET_SIZE, SHEET_SIZE);
      if (horseTexture) horseTexture.needsUpdate = true;
    };

    // --- 3. Three.js 3D Viewport Setup ---
    const viewport = document.getElementById('viewport-container');
    const loadingOverlay = document.getElementById('loading-overlay');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b1120);

    // Perspective Camera: Positioned significantly further back (z: 12.0)
    const camera = new THREE.PerspectiveCamera(45, viewport.clientWidth / viewport.clientHeight, 0.1, 1000);
    camera.position.set(0, 3.0, 12.0); 

    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('three-canvas'), antialias: true });
    renderer.setSize(viewport.clientWidth, viewport.clientHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0, 0); // Focus camera target strictly on scene origin

    // Lighting Setup
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight1.position.set(5, 12, 7);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
    dirLight2.position.set(-5, 6, -7);
    scene.add(dirLight2);

    // --- 4. Dynamic Canvas Texture Alignment ---
    const horseTexture = new THREE.CanvasTexture(texCanvas);
    horseTexture.magFilter = THREE.NearestFilter;
    horseTexture.minFilter = THREE.NearestFilter;
    horseTexture.wrapS = THREE.ClampToEdgeWrapping;
    horseTexture.wrapT = THREE.ClampToEdgeWrapping;
    
    // Critical: Fix UV vertical inversion for Minecraft HD / HorseSkinGeometry layouts
    horseTexture.flipY = true;

    const horseMaterial = new THREE.MeshStandardMaterial({ 
      map: horseTexture,
      roughness: 0.8,
      metalness: 0.1
    });

    // --- 5. GLTF Model Loader (ArrayBuffer method) ---
    const gltfLoader = new THREE.GLTFLoader();

    fetch(MODEL_PATH)
      .then(response => {
        if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
        return response.arrayBuffer();
      })
      .then(buffer => {
        gltfLoader.parse(buffer, '', (gltf) => {
          const horseModel = gltf.scene;

          // Apply material to all meshes inside the model
          horseModel.traverse((child) => {
            if (child.isMesh) {
              child.material = horseMaterial;
            }
          });

          // Precision Auto-Centering using Bounding Box
          const box = new THREE.Box3().setFromObject(horseModel);
          const center = box.getCenter(new THREE.Vector3());
          
          // Re-center model geometry exactly around origin (0,0,0)
          horseModel.position.sub(center);

          scene.add(horseModel);
          loadingOverlay.style.display = 'none';
        }, (err) => {
          throw err;
        });
      })
      .catch(error => {
        console.error('An error occurred loading horse.glb:', error);
        loadingOverlay.innerText = 'Failed to load model. Ensure local HTTP server is running.';
        loadingOverlay.style.color = '#ef4444';
      });

    // --- 6. Render Loop & Window Resize Handling ---
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = viewport.clientWidth / viewport.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(viewport.clientWidth, viewport.clientHeight);
    });
  </script>
</body>
</html>
