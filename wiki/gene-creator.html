<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Horse Gene Editor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; height: 100vh; overflow: hidden; }
    
    #sidebar { width: 340px; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; padding: 15px; gap: 15px; overflow-y: auto; }
    #viewport-container { flex: 1; position: relative; display: flex; background: #0b1120; }
    #canvas-2d-container { width: 300px; background: #1e293b; border-left: 1px solid #334155; padding: 15px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    
    h2, h3 { color: #38bdf8; font-size: 1.1rem; }
    .section { background: #0f172a; padding: 12px; border-radius: 6px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 8px; }
    label { font-size: 0.85rem; color: #94a3b8; display: flex; justify-content: space-between; align-items: center; }
    input, select, button { background: #1e293b; border: 1px solid #475569; color: #fff; padding: 6px 10px; border-radius: 4px; font-size: 0.85rem; }
    input[type="number"] { width: 70px; }
    button { cursor: pointer; background: #10b981; border: none; font-weight: bold; color: #fff; padding: 8px; border-radius: 4px; }
    button:hover { background: #059669; }
    button.secondary { background: #38bdf8; color: #0f172a; }
    button.danger { background: #ef4444; }
    
    .layer-item { background: #1e293b; padding: 8px; border-radius: 4px; border: 1px solid #334155; margin-bottom: 6px; font-size: 0.85rem; }
    #textureCanvas { border: 1px solid #475569; background: #fff; width: 256px; height: 256px; image-rendering: pixelated; }
    #three-canvas { width: 100%; height: 100%; }
    #loading-overlay { position: absolute; top: 10px; left: 10px; background: rgba(15, 23, 42, 0.8); color: #38bdf8; padding: 6px 12px; border-radius: 4px; font-size: 0.8rem; border: 1px solid #334155; }
  </style>

  <!-- Import Three.js, OrbitControls, and GLTFLoader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <!-- Left Sidebar: Gene Controls -->
  <div id="sidebar">
    <h2>Gene Editor</h2>
    
    <div class="section">
      <label>Gene Key / Identifier:
        <input type="text" id="geneName" value="gene_dappled_grey">
      </label>
      <label>Base Texture Overlay Tint:
        <input type="color" id="tintColor" value="#ffffff">
      </label>
    </div>

    <div class="section">
      <h3>Add Marking Layer</h3>
      <label>Shape Tool:
        <select id="toolType">
          <option value="ellipse">Ellipse / Dapple Spot</option>
          <option value="curve">Spline / Curve</option>
          <option value="polygon">Polygon / Patch</option>
        </select>
      </label>
      <label>Min Size (px): <input type="number" id="minSize" value="4" min="1" max="256"></label>
      <label>Max Size (px): <input type="number" id="maxSize" value="16" min="1" max="256"></label>
      <label>Frequency (Count): <input type="number" id="frequency" value="30" min="1" max="1000"></label>
      <label>Primary Pigment: <input type="color" id="primaryColor" value="#333333"></label>
      <label>Secondary Pigment: <input type="color" id="secondaryColor" value="#888888"></label>
      
      <button id="addLayerBtn">Add Layer to Gene</button>
    </div>

    <div class="section">
      <h3>Active Marking Layers</h3>
      <div id="layersList"></div>
    </div>

    <button id="exportGeneBtn" class="secondary">Export Gene JSON</button>
  </div>

  <!-- Center Viewport: 3D Minecraft Horse Model -->
  <div id="viewport-container">
    <div id="loading-overlay">Loading wiki/horse.glb...</div>
    <canvas id="three-canvas"></canvas>
  </div>

  <!-- Right Sidebar: 2D Texture Map Target -->
  <div id="canvas-2d-container">
    <h3>Coat Build Surface</h3>
    <canvas id="textureCanvas" width="256" height="256"></canvas>
    <p style="font-size: 0.75rem; color: #94a3b8; text-align: center;">Target UV sheet mapped directly to model mesh.</p>
  </div>

  <script>
    const WHITE_BASE_TEXTURE_PATH = '../common/src/main/resources/assets/horsegenetics/textures/entity/horse/horse_white.png';
    const MODEL_PATH = 'horse.glb';

    // --- 1. Gene Data Model ---
    let geneDefinition = {
      id: "gene_dappled_grey",
      tintColor: "#ffffff",
      layers: []
    };

    // --- 2. Canvas & Base Texture Loading ---
    const texCanvas = document.getElementById('textureCanvas');
    const ctx = texCanvas.getContext('2d');
    
    // Load default white base texture
    const baseImg = new Image();
    baseImg.crossOrigin = "anonymous";
    baseImg.src = WHITE_BASE_TEXTURE_PATH;
    baseImg.onload = () => {
      // Set canvas resolution dynamically based on base image if available
      texCanvas.width = baseImg.width || 256;
      texCanvas.height = baseImg.height || 256;
      renderTexture();
    };
    baseImg.onerror = () => {
      console.warn(`Could not load ${WHITE_BASE_TEXTURE_PATH}, defaulting to fallback canvas.`);
      renderTexture();
    };

    function renderTexture() {
      // Draw white base texture image or fallback background
      if (baseImg.complete && baseImg.naturalWidth !== 0) {
        ctx.drawImage(baseImg, 0, 0, texCanvas.width, texCanvas.height);
      } else {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, texCanvas.width, texCanvas.height);
      }

      // Apply tint overlay
      if (geneDefinition.tintColor !== "#ffffff") {
        ctx.fillStyle = geneDefinition.tintColor;
        ctx.globalCompositeOperation = "multiply";
        ctx.fillRect(0, 0, texCanvas.width, texCanvas.height);
        ctx.globalCompositeOperation = "source-over";
      }

      // Render marking layers onto Pigment/Overlay surface
      geneDefinition.layers.forEach(layer => {
        for (let i = 0; i < layer.frequency; i++) {
          const x = Math.random() * texCanvas.width;
          const y = Math.random() * texCanvas.height;
          const size = layer.minSize + Math.random() * (layer.maxSize - layer.minSize);

          ctx.save();
          const grad = ctx.createRadialGradient(x, y, 0, x, y, size);
          grad.addColorStop(0, layer.primaryColor);
          grad.addColorStop(1, layer.secondaryColor);
          ctx.fillStyle = grad;
          ctx.strokeStyle = layer.primaryColor;

          if (layer.type === 'ellipse') {
            ctx.beginPath();
            ctx.ellipse(x, y, size, size * 0.7, Math.random() * Math.PI, 0, Math.PI * 2);
            ctx.fill();
          } else if (layer.type === 'polygon') {
            ctx.beginPath();
            const points = 5;
            for (let j = 0; j < points; j++) {
              const angle = (j / points) * Math.PI * 2;
              const r = size * (0.6 + Math.random() * 0.4);
              const px = x + Math.cos(angle) * r;
              const py = y + Math.sin(angle) * r;
              if (j === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
          } else if (layer.type === 'curve') {
            ctx.beginPath();
            ctx.lineWidth = Math.max(1, size * 0.25);
            ctx.moveTo(x, y);
            ctx.bezierCurveTo(
              x + (Math.random() - 0.5) * size * 2, y + (Math.random() - 0.5) * size * 2,
              x + (Math.random() - 0.5) * size * 2, y + (Math.random() - 0.5) * size * 2,
              x + (Math.random() - 0.5) * size * 3, y + (Math.random() - 0.5) * size * 3
            );
            ctx.stroke();
          }
          ctx.restore();
        }
      });

      if (horseTexture) horseTexture.needsUpdate = true;
    }

    // --- 3. Three.js 3D Viewport Setup ---
    const viewport = document.getElementById('viewport-container');
    const loadingOverlay = document.getElementById('loading-overlay');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b1120);

    const camera = new THREE.PerspectiveCamera(45, viewport.clientWidth / viewport.clientHeight, 0.1, 1000);
    camera.position.set(0, 1.5, 3.5);

    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('three-canvas'), antialias: true });
    renderer.setSize(viewport.clientWidth, viewport.clientHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 1, 0);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    // Dynamic Canvas Texture
    const horseTexture = new THREE.CanvasTexture(texCanvas);
    horseTexture.magFilter = THREE.NearestFilter;
    horseTexture.minFilter = THREE.NearestFilter;
    horseTexture.flipY = false; // Match Minecraft UV coordinate standard

    const horseMaterial = new THREE.MeshStandardMaterial({ 
      map: horseTexture,
      roughness: 0.8,
      metalness: 0.1
    });

    // Load actual horse.glb GLTF Model
    const loader = new THREE.GLTFLoader();
    loader.load(
      MODEL_PATH,
      (gltf) => {
        const horseModel = gltf.scene;
        horseModel.traverse((child) => {
          if (child.isMesh) {
            child.material = horseMaterial;
          }
        });
        
        // Auto-center model
        const box = new THREE.Box3().setFromObject(horseModel);
        const center = box.getCenter(new THREE.Vector3());
        horseModel.position.sub(center);
        horseModel.position.y += (box.max.y - box.min.y) / 2;

        scene.add(horseModel);
        loadingOverlay.style.display = 'none';
      },
      (xhr) => {
        if (xhr.lengthComputable) {
          const percent = Math.round((xhr.loaded / xhr.total) * 100);
          loadingOverlay.innerText = `Loading wiki/horse.glb... (${percent}%)`;
        }
      },
      (error) => {
        console.error('An error occurred loading wiki/horse.glb:', error);
        loadingOverlay.innerText = 'Failed to load wiki/horse.glb model.';
        loadingOverlay.style.color = '#ef4444';
      }
    );

    // --- 4. UI Interactions ---
    document.getElementById('tintColor').addEventListener('input', (e) => {
      geneDefinition.tintColor = e.target.value;
      renderTexture();
    });

    document.getElementById('addLayerBtn').addEventListener('click', () => {
      const layer = {
        id: Date.now(),
        type: document.getElementById('toolType').value,
        minSize: parseFloat(document.getElementById('minSize').value),
        maxSize: parseFloat(document.getElementById('maxSize').value),
        frequency: parseInt(document.getElementById('frequency').value),
        primaryColor: document.getElementById('primaryColor').value,
        secondaryColor: document.getElementById('secondaryColor').value
      };

      geneDefinition.layers.push(layer);
      updateLayersUI();
      renderTexture();
    });

    function updateLayersUI() {
      const list = document.getElementById('layersList');
      list.innerHTML = '';
      geneDefinition.layers.forEach((layer, idx) => {
        const item = document.createElement('div');
        item.className = 'layer-item';
        item.innerHTML = `
          <strong>${idx + 1}. ${layer.type.toUpperCase()}</strong> (${layer.frequency}x)<br>
          Size: ${layer.minSize}-${layer.maxSize}px
          <button class="danger" style="float:right; padding: 2px 6px;" onclick="removeLayer(${layer.id})">X</button>
        `;
        list.appendChild(item);
      });
    }

    window.removeLayer = function(id) {
      geneDefinition.layers = geneDefinition.layers.filter(l => l.id !== id);
      updateLayersUI();
      renderTexture();
    };

    // Export JSON
    document.getElementById('exportGeneBtn').addEventListener('click', () => {
      geneDefinition.id = document.getElementById('geneName').value;
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(geneDefinition, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `${geneDefinition.id}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    });

    // Window Resizing
    window.addEventListener('resize', () => {
      camera.aspect = viewport.clientWidth / viewport.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(viewport.clientWidth, viewport.clientHeight);
    });

    // Animation Loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
