<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horse Gene Creator - Parametric Editor</title>
  <style>
    :root {
      --bg-dark: #0b1120;
      --panel-bg: #1e293b;
      --panel-border: #334155;
      --text-main: #f8fafc;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    #app-container {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* Left Toolbox */
    #toolbox {
      width: 320px;
      background-color: var(--panel-bg);
      border-right: 1px solid var(--panel-border);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      z-index: 5;
    }

    /* Center Viewport & Canvas */
    #main-workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    #viewport-container {
      flex: 1;
      position: relative;
      background-color: var(--bg-dark);
    }

    #three-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(11, 17, 32, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.25rem;
      font-weight: 600;
      z-index: 10;
      transition: opacity 0.3s ease;
    }

    /* Right Output Panel */
    #output-panel {
      width: 360px;
      background-color: var(--panel-bg);
      border-left: 1px solid var(--panel-border);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 5;
    }

    /* UI Components */
    .section-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .tool-group {
      background: #0f172a;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      background-color: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: #334155;
    }

    .btn-secondary:hover {
      background-color: #475569;
    }

    label {
      font-size: 0.8rem;
      color: #cbd5e1;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    input[type="range"], input[type="color"], select, input[type="number"], input[type="text"] {
      background: #1e293b;
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      border-radius: 4px;
      padding: 4px;
    }

    .canvas-container {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 6;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    #coat-canvas {
      width: 256px;
      height: 256px;
      image-rendering: pixelated;
      background-color: #1e293b;
      border: 1px solid var(--panel-border);
      cursor: crosshair;
    }

    #json-output {
      flex: 1;
      background: #0f172a;
      color: #38bdf8;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 12px;
      font-family: monospace;
      font-size: 0.75rem;
      resize: none;
      white-space: pre-wrap;
    }
  </style>

  <!-- Three.js Dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div id="app-container">
    
    <!-- LEFT TOOLBOX -->
    <div id="toolbox">
      <h2>Gene Toolbox</h2>

      <div class="tool-group">
        <div class="section-title">Gene Definition</div>
        <label>Gene Identifier
          <input type="text" id="gene-id" value="gene_tobiano_stripe" />
        </label>
        <label>Phenotype Frequency
          <input type="range" id="gene-frequency" min="0" max="1" step="0.01" value="0.35" />
        </label>
      </div>

      <div class="tool-group">
        <div class="section-title">Add Vector Shape</div>
        <button class="btn" id="btn-add-bezier">+ Bézier Spline</button>
        <button class="btn btn-secondary" id="btn-add-ellipse">+ Parametric Ellipse</button>
      </div>

      <div class="tool-group">
        <div class="section-title">Shape Properties</div>
        <label>Target Part
          <select id="shape-part">
            <option value="BODY">BODY</option>
            <option value="NECK">NECK</option>
            <option value="HEAD">HEAD</option>
            <option value="LEFT_FRONT_LEG">LEFT_FRONT_LEG</option>
            <option value="RIGHT_FRONT_LEG">RIGHT_FRONT_LEG</option>
            <option value="LEFT_HIND_LEG">LEFT_HIND_LEG</option>
            <option value="RIGHT_HIND_LEG">RIGHT_HIND_LEG</option>
          </select>
        </label>
        
        <label>Min Expression Scale
          <input type="range" id="shape-min-scale" min="0.1" max="2.0" step="0.05" value="0.5" />
        </label>
        <label>Max Expression Scale
          <input type="range" id="shape-max-scale" min="0.1" max="2.0" step="0.05" value="1.2" />
        </label>
      </div>

      <div class="tool-group">
        <div class="section-title">Color Range & Gradient</div>
        <label>Color Start
          <input type="color" id="color-start" value="#ffffff" />
        </label>
        <label>Color End
          <input type="color" id="color-end" value="#f1f5f9" />
        </label>
        <label>Gradient Mode
          <select id="gradient-mode">
            <option value="LINEAR">Linear</option>
            <option value="RADIAL">Radial</option>
            <option value="SOLID">Solid</option>
          </select>
        </label>
      </div>
    </div>

    <!-- MAIN WORKSPACE -->
    <div id="main-workspace">
      <div id="viewport-container">
        <div id="loading-overlay">Loading 3D Gene Preview...</div>
        <canvas id="three-canvas"></canvas>
      </div>

      <!-- Interactive 2D UV Canvas Overlay -->
      <div class="canvas-container">
        <div class="section-title" style="margin:0;">128x128 UV Vector Editor</div>
        <canvas id="coat-canvas" width="128" height="128"></canvas>
      </div>
    </div>

    <!-- RIGHT OUTPUT PANEL -->
    <div id="output-panel">
      <h2>Parametric Gene JSON</h2>
      <div class="section-title">Generated Definition</div>
      <textarea id="json-output" readonly></textarea>
      <button class="btn" id="btn-copy-json">Copy JSON</button>
    </div>

  </div>

  <script>
    // --- 1. Configuration & Geometry Mapping Data ---
    const MODEL_PATH = 'horse.glb'; 
    const BASE_TEXTURE_PATH = 'horse_white.png';
    const SHEET_SIZE = 128;

    const PART_BOUNDS = {
      BODY: { tu: 0*2, tv: 32*2, w: 22*2, h: 10*2, d: 10*2 },
      NECK: { tu: 0*2, tv: 35*2, w: 7*2, h: 12*2, d: 4*2 },
      HEAD: { tu: 0*2, tv: 13*2, w: 7*2, h: 5*2, d: 6*2 },
      LEFT_FRONT_LEG: { tu: 26*2, tv: 16*2, w: 4*2, h: 11*2, d: 4*2 },
      RIGHT_FRONT_LEG: { tu: 48*2, tv: 0*2, w: 4*2, h: 11*2, d: 4*2 },
      LEFT_HIND_LEG: { tu: 26*2, tv: 0*2, w: 4*2, h: 11*2, d: 4*2 },
      RIGHT_HIND_LEG: { tu: 48*2, tv: 21*2, w: 4*2, h: 11*2, d: 4*2 }
    };

    const geneState = {
      geneId: "gene_tobiano_stripe",
      frequency: 0.35,
      shapes: [
        {
          id: "shape_1",
          type: "BEZIER",
          part: "BODY",
          expression: { minScale: 0.5, maxScale: 1.2 },
          color: { start: "#ffffff", end: "#f1f5f9", gradient: "LINEAR" },
          points: [
            { x: 0.1, y: 0.5 },
            { x: 0.4, y: 0.1 },
            { x: 0.7, y: 0.9 },
            { x: 0.9, y: 0.4 }
          ]
        }
      ]
    };

    // --- 2. 2D Interactive Canvas Editor ---
    const texCanvas = document.getElementById('coat-canvas');
    const ctx = texCanvas.getContext('2d');
    let selectedPoint = null;

    // FIX #1: Declare horseTexture BEFORE render2DCanvas() relies on it
    const horseTexture = new THREE.CanvasTexture(texCanvas);
    horseTexture.magFilter = THREE.NearestFilter;
    horseTexture.minFilter = THREE.NearestFilter;
    horseTexture.wrapS = THREE.ClampToEdgeWrapping;
    horseTexture.wrapT = THREE.ClampToEdgeWrapping;
    horseTexture.flipY = true;

    // FIX #2: Load base texture asynchronously
    const baseImg = new Image();
    let isBaseImgLoaded = false;
    baseImg.src = BASE_TEXTURE_PATH;
    baseImg.onload = () => {
      isBaseImgLoaded = true;
      render2DCanvas();
    };

    function render2DCanvas() {
      // Clear or draw loaded base skin texture
      if (isBaseImgLoaded) {
        ctx.drawImage(baseImg, 0, 0, SHEET_SIZE, SHEET_SIZE);
      } else {
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(0, 0, SHEET_SIZE, SHEET_SIZE);
      }

      // Draw UV Part Outlines
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 1;
      for (const [partName, bounds] of Object.entries(PART_BOUNDS)) {
        ctx.strokeRect(bounds.tu, bounds.tv, bounds.w + bounds.d, bounds.h + bounds.d);
      }

      // Render Active Shapes
      geneState.shapes.forEach(shape => {
        const bounds = PART_BOUNDS[shape.part];
        if (!bounds) return;

        if (shape.type === "BEZIER") {
          const pts = shape.points.map(p => ({
            x: bounds.tu + p.x * bounds.w,
            y: bounds.tv + p.y * bounds.h
          }));

          ctx.beginPath();
          ctx.moveTo(pts[0].x, pts[0].y);
          ctx.bezierCurveTo(pts[1].x, pts[1].y, pts[2].x, pts[2].y, pts[3].x, pts[3].y);
          ctx.strokeStyle = shape.color.start;
          ctx.lineWidth = 6 * shape.expression.maxScale;
          ctx.stroke();

          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(pts[0].x, pts[0].y); ctx.lineTo(pts[1].x, pts[1].y);
          ctx.moveTo(pts[2].x, pts[2].y); ctx.lineTo(pts[3].x, pts[3].y);
          ctx.stroke();

          pts.forEach((p, idx) => {
            ctx.fillStyle = idx === 0 || idx === 3 ? '#ef4444' : '#38bdf8';
            ctx.beginPath();
            ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
            ctx.fill();
          });
        } else if (shape.type === "ELLIPSE") {
          const center = {
            x: bounds.tu + shape.points[0].x * bounds.w,
            y: bounds.tv + shape.points[0].y * bounds.h
          };
          const rx = (shape.radiusX || 10) * shape.expression.maxScale;
          const ry = (shape.radiusY || 5) * shape.expression.maxScale;

          ctx.beginPath();
          ctx.ellipse(center.x, center.y, rx, ry, 0, 0, Math.PI * 2);
          ctx.fillStyle = shape.color.start;
          ctx.fill();

          ctx.fillStyle = '#ef4444';
          ctx.beginPath();
          ctx.arc(center.x, center.y, 3, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      horseTexture.needsUpdate = true;
      updateJSONOutput();
    }

    // Canvas Interactions
    texCanvas.addEventListener('mousedown', (e) => {
      const rect = texCanvas.getBoundingClientRect();
      const clickX = (e.clientX - rect.left) * (SHEET_SIZE / rect.width);
      const clickY = (e.clientY - rect.top) * (SHEET_SIZE / rect.height);

      const shape = geneState.shapes[0];
      if (!shape) return;

      const bounds = PART_BOUNDS[shape.part];
      shape.points.forEach((p, idx) => {
        const px = bounds.tu + p.x * bounds.w;
        const py = bounds.tv + p.y * bounds.h;
        if (Math.hypot(clickX - px, clickY - py) < 6) {
          selectedPoint = idx;
        }
      });
    });

    texCanvas.addEventListener('mousemove', (e) => {
      if (selectedPoint === null) return;
      const rect = texCanvas.getBoundingClientRect();
      const clickX = (e.clientX - rect.left) * (SHEET_SIZE / rect.width);
      const clickY = (e.clientY - rect.top) * (SHEET_SIZE / rect.height);

      const shape = geneState.shapes[0];
      const bounds = PART_BOUNDS[shape.part];

      shape.points[selectedPoint].x = Math.max(0, Math.min(1, (clickX - bounds.tu) / bounds.w));
      shape.points[selectedPoint].y = Math.max(0, Math.min(1, (clickY - bounds.tv) / bounds.h));

      render2DCanvas();
    });

    window.addEventListener('mouseup', () => { selectedPoint = null; });

    // --- 3. Three.js Viewport Setup ---
    const viewport = document.getElementById('viewport-container');
    const loadingOverlay = document.getElementById('loading-overlay');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b1120);

    const camera = new THREE.PerspectiveCamera(45, viewport.clientWidth / viewport.clientHeight, 0.1, 1000);
    // FIX #3: Adjusted camera framing for closer viewport positioning
    camera.position.set(0, 1.5, 5.0);

    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('three-canvas'), antialias: true });
    renderer.setSize(viewport.clientWidth, viewport.clientHeight);
    
    // FIX #5: Updated color space API specification for modern Three.js
    if (THREE.SRGBColorSpace) {
      renderer.outputColorSpace = THREE.SRGBColorSpace;
    } else {
      renderer.outputEncoding = THREE.sRGBEncoding;
    }

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0, 0);

    const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 12, 7);
    scene.add(dirLight);

    const horseMaterial = new THREE.MeshStandardMaterial({ 
      map: horseTexture,
      roughness: 0.8,
      metalness: 0.1
    });

    // GLTF Model Loading
    const gltfLoader = new THREE.GLTFLoader();
    fetch(MODEL_PATH)
      .then(res => {
        if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
        return res.arrayBuffer();
      })
      .then(buffer => {
        gltfLoader.parse(buffer, '', (gltf) => {
          const horseModel = gltf.scene;
          horseModel.traverse((child) => {
            if (child.isMesh) child.material = horseMaterial;
          });

          const box = new THREE.Box3().setFromObject(horseModel);
          const center = box.getCenter(new THREE.Vector3());
          horseModel.position.sub(center);

          scene.add(horseModel);
          loadingOverlay.style.opacity = '0';
          setTimeout(() => loadingOverlay.style.display = 'none', 300);
        });
      })
      .catch((err) => {
        // FIX #4: Clear loading overlay on error with explicit user notification
        console.warn('Failed loading 3D model:', err);
        loadingOverlay.innerText = '3D Preview Unavailable (Canvas Editor Active)';
        loadingOverlay.style.color = '#ef4444';
        setTimeout(() => {
          loadingOverlay.style.opacity = '0';
          setTimeout(() => loadingOverlay.style.display = 'none', 300);
        }, 3000);
      });

    // --- 4. JSON Serialization ---
    const jsonOutput = document.getElementById('json-output');

    function updateJSONOutput() {
      jsonOutput.value = JSON.stringify(geneState, null, 2);
    }

    // UI Event Handlers
    document.getElementById('gene-id').addEventListener('input', (e) => {
      geneState.geneId = e.target.value;
      updateJSONOutput();
    });

    document.getElementById('gene-frequency').addEventListener('input', (e) => {
      geneState.frequency = parseFloat(e.target.value);
      updateJSONOutput();
    });

    document.getElementById('shape-part').addEventListener('change', (e) => {
      if (geneState.shapes[0]) geneState.shapes[0].part = e.target.value;
      render2DCanvas();
    });

    document.getElementById('shape-min-scale').addEventListener('input', (e) => {
      if (geneState.shapes[0]) geneState.shapes[0].expression.minScale = parseFloat(e.target.value);
      render2DCanvas();
    });

    document.getElementById('shape-max-scale').addEventListener('input', (e) => {
      if (geneState.shapes[0]) geneState.shapes[0].expression.maxScale = parseFloat(e.target.value);
      render2DCanvas();
    });

    document.getElementById('color-start').addEventListener('input', (e) => {
      if (geneState.shapes[0]) geneState.shapes[0].color.start = e.target.value;
      render2DCanvas();
    });

    document.getElementById('btn-add-bezier').addEventListener('click', () => {
      geneState.shapes[0] = {
        id: `shape_${Date.now()}`,
        type: "BEZIER",
        part: document.getElementById('shape-part').value,
        expression: { minScale: 0.5, maxScale: 1.2 },
        color: { start: document.getElementById('color-start').value, end: "#ffffff", gradient: "LINEAR" },
        points: [{ x: 0.1, y: 0.5 }, { x: 0.4, y: 0.1 }, { x: 0.7, y: 0.9 }, { x: 0.9, y: 0.4 }]
      };
      render2DCanvas();
    });

    document.getElementById('btn-add-ellipse').addEventListener('click', () => {
      geneState.shapes[0] = {
        id: `shape_${Date.now()}`,
        type: "ELLIPSE",
        part: document.getElementById('shape-part').value,
        expression: { minScale: 0.5, maxScale: 1.2 },
        color: { start: document.getElementById('color-start').value, end: "#ffffff", gradient: "RADIAL" },
        points: [{ x: 0.5, y: 0.5 }],
        radiusX: 12,
        radiusY: 6
      };
      render2DCanvas();
    });

    document.getElementById('btn-copy-json').addEventListener('click', () => {
      navigator.clipboard.writeText(jsonOutput.value);
      alert('Gene JSON copied to clipboard!');
    });

    // --- 5. Render Loop ---
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    render2DCanvas();
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = viewport.clientWidth / viewport.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(viewport.clientWidth, viewport.clientHeight);
    });
  </script>
</body>
</html>
