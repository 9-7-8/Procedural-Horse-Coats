<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horse Designer</title>
  <link rel="stylesheet" href="designer.css" />
</head>
<body>

<!-- The field. Full window, with the GUI over it - the same arrangement a
     Minecraft screen has, where the world carries on behind the panels. -->
<div id="field"></div>

<!-- The GUI: a redraw of CustomHorseSpawnScreen. See js/gui.js. -->
<canvas id="gui"></canvas>

<div class="boot" id="boot">
  <div class="boot-inner">
    <h1>Horse Designer</h1>
    <p>Loading the mod&hellip;</p>
    <p class="sub">
      <code>common/</code> compiled to WebAssembly &mdash; every gene the mod has,
      the real coat pipeline, no server.
    </p>
  </div>
</div>

<a class="back" href="../../index.html">&larr; wiki</a>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<!-- Shared with the gene creator: the geometry tables and the mesh builder.
     A mesh builder is view code, and js/java.js re-checks the tables against
     the compiled Java on every load. Nothing genetic is loaded here - the
     genes come out of the wasm. -->
<script src="../gene-creator/js/geometry.js"></script>
<script src="../gene-creator/js/model3d.js"></script>

<script src="js/java.js"></script>
<script src="js/gene-icons.js"></script>
<script src="js/gui.js"></script>
<script src="js/scene.js"></script>
<script src="js/animation.js"></script>
<script src="js/designer.js"></script>
<script>window.HG.designer.start();</script>
</body>
</html>
