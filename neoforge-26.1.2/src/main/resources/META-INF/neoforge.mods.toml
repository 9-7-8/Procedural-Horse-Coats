modLoader = "javafml"
loaderVersion = "[1,)"
license = "CC BY-NC 4.0"

[[mods]]
modId = "horsegenetics"
version = "${mod_version}"
displayName = "Horse Genetics"
description = "Genetics-based coat generation for horses, starting with extension/agouti and bay leg patterning."
credits = '''
Cart system derived from UsefulCarts / NiftyCarts / AstikorCarts (MIT).
AstikorCarts by MennoMax (with paul101); NiftyCarts by jmb19905;
UsefulCarts 26.1 port by the UsefulCarts porter. See THIRD_PARTY_NOTICES.md.
'''

[[dependencies.horsegenetics]]
    modId = "neoforge"
    type = "required"
    versionRange = "[26.1.2,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.horsegenetics]]
    modId = "minecraft"
    type = "required"
    # This SDK reports Minecraft as "26.1.2" (NeoForge-aligned scheme), not "1.26.1".
    versionRange = "[26.1.2,)"
    ordering = "NONE"
    side = "BOTH"

# FOUR MIXINS. This comment said "THE ONE MIXIN" long after there were four, and
# that stale line was read as fact and repeated on 2026-09-16 - so it is now a
# list, which is harder to leave wrong:
#
#   LavaTravelMixin    LivingEntity.travelInLava hardcodes lava's speed and reads
#                      no attribute, so a fireproof horse crawled and nothing in
#                      the gene format could change it (known-gaps gap 179). A
#                      ModifyConstant returning vanilla's own value unless the
#                      entity carries this mod's lava_movement attribute.
#   HorseSwimMixin     LivingEntity.travelInWater, same shape, for swimming.
#   HorseRegenMixin    AbstractHorse.aiStep - redirects the vanilla heal call.
#   HorseRearFightMixin  AbstractHorse.isImmobile.
#
# All four use the narrowest injector that works and argue in their own javadoc
# why nothing cheaper does. Keep that bar.
#
# NOTE FOR ANYONE ADDING ONE: there is deliberately no "client" section in
# horsegenetics.mixins.json. A mixin on a client-only class - any Screen, for
# instance - put in the common "mixins" list crashes a dedicated server at mod
# load. Add a "client" block for those, or use a NeoForge client event instead;
# ScreenEvent.Init.Post and ContainerScreenEvent already cover most of it, and
# HorseScreenHooks is the working example.
[[mixins]]
config = "horsegenetics.mixins.json"
