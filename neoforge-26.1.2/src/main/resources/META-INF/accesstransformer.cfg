# The village generator has no data-driven way to *append* to a vanilla
# template pool - a datapack can only replace the whole file, which would
# hard-code today's four plains terminators into this mod and silently drop any
# other mod's additions. BarnPoolInjector appends instead, and needs the pool's
# own element lists to do it. See wiki/api-notes.html.
public net.minecraft.world.level.levelgen.structure.pools.StructureTemplatePool templates
public net.minecraft.world.level.levelgen.structure.pools.StructureTemplatePool maxSize
public-f net.minecraft.world.level.levelgen.structure.pools.StructureTemplatePool rawTemplates

# Levelling a villager is private, and the only public routes to it are trading
# with him three hundred times or setting his level and then being unable to
# re-roll his trades (updateTrades is protected, and getOffers only rebuilds a
# null list). DebugHorsemanLevelUp needs the one call that does both, so the
# clock shortcut can put a horseman on tier 5 in five clicks. Dev tooling only -
# nothing in the shipped gameplay path touches it. See wiki/api-notes.html.
public net.minecraft.world.entity.npc.villager.Villager increaseMerchantCareer(Lnet/minecraft/server/level/ServerLevel;)V

# HorseSpeedFloor floors a horse's *attribute* at the slowest speed vanilla
# itself will ever roll for a horse. That number is generateSpeed(() -> 0.0),
# which is protected static on AbstractHorse and so out of reach of anything
# that does not extend it. Writing 0.1125 down instead would be a derived
# number in prose, which this repo has been bitten by before - and it is
# vanilla's formula, so it is exactly the kind of number that moves under you.
public net.minecraft.world.entity.animal.equine.AbstractHorse generateSpeed(Ljava/util/function/DoubleSupplier;)D
