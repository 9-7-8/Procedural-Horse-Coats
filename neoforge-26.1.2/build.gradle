// Adapted from the real MDK-26.1.2-ModDevGradle template (confirmed via
// your clone - plugin version 2.0.144, neo_version 26.1.2.100). Trimmed
// out the datagen/generateModMetadata templating and maven-publish blocks
// from the original template since this project doesn't need them yet -
// add them back later if you start using data generators or publishing.
// The one addition beyond the template: the dependency on :common at the
// bottom, which is what makes this a two-module project instead of the
// template's single-module layout.

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.1.2, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        // Launch straight into the test world and on into the horse dimension's yard
        // (owner, 2026-09-14): ./gradlew :neoforge-26.1.2:runClientTestWorld
        // The task name is checked (gradlew tasks lists runClientTestWorld). It does share
        // run/ with `client`, which was the open question here: RunModel's constructor sets
        // gameDirectory's convention to projectDirectory.dir("run") for EVERY run whatever
        // its name (ModDevGradle 2.0.144, read off the plugin). That is why the gametest
        // run below has to override it rather than inherit.
        clientTestWorld {
            client()
            systemProperty 'horsegenetics.autoTestWorld', 'true'
        }
        server {
            server()
            programArgument '--nogui'
        }
        // Headless in-game tests: ./gradlew :neoforge-26.1.2:runGameTest
        // There is no gameTestServer() helper in ModDevGradle - the run type is a
        // plain string, and 'gameTestServer' is a real key in the userdev config
        // (it sets neoforge.enableGameTest itself). Its own gameDirectory is not
        // optional: EVERY run defaults to run/, so without this it takes the world
        // lock off a client that is already up. --universe is wiped and recreated
        // each run, so it must sit inside that directory. A --tests selector that
        // matches nothing exits -1, so a typo reads as a failure rather than a pass.
        gameTest {
            type = 'gameTestServer'
            gameDirectory = project.layout.projectDirectory.dir('run-gametest')
            programArgument '--universe'
            programArgument 'world'
            programArgument '--tests'
            programArgument 'horsegenetics:*'
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// The shared image assets (textures, and later a lot more) live in :common so
// a future forge-1.12.2 module can consume the same source of truth. :common
// is a plain library, so its `assets/` tree is on the classpath but is NOT
// discovered as a mod resource pack - fold it into this module's own resources
// at build time. `include 'assets/**'` keeps it from colliding with :common's
// classpath-only `horsegenetics/names/**` word tables.
// The gene pictures for the spawn egg's hover card. The wiki's icons are
// 236x210 and the card draws them 64x57, so the jar gets its own copies at
// exactly that size, written here at build time - nothing from wiki/ goes into
// the jar as it is. Nearest-neighbour on purpose: a smooth resize makes
// gradients that PNG compresses worse than the full-size originals (tried: the
// jar grew), and the GUI draws textures unfiltered anyway. `_bay.png` and
// `_sheet.png` are the bake's reference images, not icons.
def geneIconsIn = rootProject.file("wiki/assets/gene-icons")
def geneIconsOut = layout.buildDirectory.dir("generated/gene-icons")
tasks.register('shrinkGeneIcons') {
    inputs.dir(geneIconsIn)
    outputs.dir(geneIconsOut)
    doLast {
        def dir = new File(geneIconsOut.get().asFile, "assets/horsegenetics/textures/gui/gene_icons")
        dir.deleteDir()
        dir.mkdirs()
        geneIconsIn.listFiles().findAll { it.name.endsWith('.png') && !it.name.startsWith('_') }.each { f ->
            def src = javax.imageio.ImageIO.read(f)
            int w = 64
            int h = (int) Math.round(src.height * (w / (double) src.width))
            def dst = new java.awt.image.BufferedImage(w, h, java.awt.image.BufferedImage.TYPE_INT_ARGB)
            def g = dst.createGraphics()
            g.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION,
                    java.awt.RenderingHints.VALUE_INTERPOLATION_NEAREST_NEIGHBOR)
            g.drawImage(src, 0, 0, w, h, null)
            g.dispose()
            javax.imageio.ImageIO.write(dst, 'png', new File(dir, f.name))
        }
    }
}

processResources {
    from(project(":common").file("src/main/resources")) {
        include "assets/**"
    }

    dependsOn tasks.named('shrinkGeneIcons')
    from(geneIconsOut)

    // The mod version lived twice - here as `mod_version`, and again as a
    // literal in neoforge.mods.toml - and a release shipped a jar named 0.3.7
    // that told the game it was 0.3.6, because bumping one is not bumping the
    // other. Templated so gradle.properties is the only place it is written.
    // Only this one file is expanded: `expand` on the whole tree would try to
    // read every $ in every JSON as a Groovy reference.
    def props = [mod_version: project.version.toString()]
    inputs.properties(props)
    filesMatching("META-INF/neoforge.mods.toml") {
        expand(props)
    }
}

// The first third-party mod this project has ever compiled against, and the
// only repository block in this module - ModDevGradle injects the NeoForge and
// Mojang ones, so there was never a reason for one before.
//
// It is here rather than in settings.gradle.kts because it exists for the
// published APIs of other mods and nothing else: Jade's plugin API, and now
// Waystones' teleport API (with Balm and Shogi, whose types it is built out
// of). That is the line this does not cross - `compat/HorsePoweredCompat`
// refuses to reach into another mod's internals because it would be guessing at
// names that can be renamed without warning, and an API a mod publishes and
// versions for this purpose is the opposite of a guess.
repositories {
    maven {
        url = "https://api.modrinth.com/maven"
        content {
            // Nothing else may be resolved from here. A typo'd coordinate
            // should fail loudly rather than quietly pull some other artifact
            // of the same name off Modrinth.
            includeGroup("maven.modrinth")
        }
    }
    // Waystones' author's own maven, for ONE artifact Modrinth cannot give:
    // shogi-api. Modrinth serves the shipped mod jar, and Shogi ships its API as
    // a JARJAR-NESTED jar (META-INF/jarjar/net.blay09.mods.shogi-api-*.jar),
    // which Gradle never unpacks onto a compile classpath. So the Modrinth
    // artifact resolves, looks right, and is missing exactly the one type
    // Waystones' own API is built out of - WaystoneTeleportContext extends
    // net.blay09.mods.shogi.context.ShogiContext, and javac must walk that to
    // type-check any call on the context. It fails as "cannot access
    // ShogiContext", not as a missing dependency, which is what made it worth
    // this comment.
    maven {
        url = "https://maven.twelveiterations.com/repository/maven-public/"
        content {
            includeGroup("net.blay09.mods")
        }
    }
}

dependencies {
    implementation project(":common")

    // Jade, compile-only: the jar is never shipped and never required. If it is
    // absent at runtime nothing here loads, because the only class that touches
    // it is annotated @WailaPlugin and Jade itself is what scans for that.
    // 26.1.11 is the newest Jade built for game version 26.1.2.
    compileOnly "maven.modrinth:jade:26.1.11+neoforge"

    // Waystones, compile-only, and the second published API this project builds
    // against - same reasoning as Jade above, same rule about not guessing at
    // another mod's internals. `compat/WaystonesCompat` is the only class that
    // touches it, it is loaded from a guarded ModList check, and the jar is
    // never shipped.
    //
    // THREE coordinates for one integration, because the API's own types come
    // from all three: WaystoneTeleportEvent.Prepare hangs its listener off
    // Balm's BidirectionalEventMapper, and WaystoneTeleportContext extends
    // Shogi's ShogiContext. Versions are what Waystones 26.1.2.15 declares as
    // its own minimums in neoforge.mods.toml.
    // Pinned to the versions actually installed alongside this mod (the ATM11
    // instance ships waystones 26.1.2.15 / balm 26.1.2.13), not to the newest.
    // Modrinth's version strings carry the loader AND game version as a suffix -
    // "+neoforge-26.1.2", not Jade's bare "+neoforge" - and a wrong one fails
    // resolution rather than falling back, which is what caught this.
    compileOnly "maven.modrinth:waystones:26.1.2.15+neoforge-26.1.2"
    compileOnly "maven.modrinth:balm:26.1.2.13+neoforge-26.1.2"
    compileOnly "maven.modrinth:shogi:26.1.2.8+neoforge-26.1.2"
    // ...and Shogi's API, which is NOT inside the artifact above - see the
    // second repository block for why. Without it the Waystones API compiles
    // to "cannot access ShogiContext".
    compileOnly "net.blay09.mods:shogi-api:26.1.2.8"

    // Plain JUnit, no Minecraft. The only thing tested here is compat's
    // MaterialScan, which deliberately imports nothing from Minecraft or
    // NeoForge so that it can be exercised without booting either - see its
    // class note. Gson is explicit because the test classpath does not inherit
    // the Minecraft libraries the main source set gets from ModDevGradle.
    testImplementation(platform("org.junit:junit-bom:5.10.2"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testImplementation("com.google.code.gson:gson:2.11.0")
    testImplementation("org.jspecify:jspecify:1.0.0")
    // Gradle 9 no longer puts the JUnit Platform launcher on the test runtime
    // classpath automatically - without this the test JVM fails to start with
    // "Failed to load JUnit Platform". Version comes from the BOM above.
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

tasks.named('test') {
    useJUnitPlatform()
}

// A jar dropped into a real `mods/` folder must be self-contained. Gradle only
// puts :common on the classpath for the dev runs (runClient/runServer) - it is
// NOT folded into the jar by `implementation project(":common")`. Pull :common's
// compiled classes and its classpath-only resources (the horsegenetics/names/**
// word tables, which HorseRecords loads on class-init and throws without) into
// the jar here. `assets/**` is already merged by processResources above, so
// exclude it to avoid duplicate entries.
tasks.named('jar', Jar) {
    from(project(':common').sourceSets.main.output) {
        exclude 'assets/**'
        // Wiki and build tooling, not the game: the bakes that write the wiki's
        // icons, pages, fixtures and facts (every *Tool is one - nothing in the
        // game calls them), and the gene creator's example files.
        exclude '**/*Tool.class', '**/*Tool$*.class'
        exclude 'horsegenetics/example-genes/**'
    }
    // The MIT licence the cart system arrives under has exactly one condition:
    // the copyright and permission notice must travel with every copy of the
    // software. A copy of the software is this jar, so the notice has to be
    // inside it - a file sitting in the repository is not a copy shipping with
    // the build. See THIRD_PARTY_NOTICES.md.
    from(rootProject.file('LICENSES')) { into 'META-INF/licenses' }
    from(rootProject.file('THIRD_PARTY_NOTICES.md')) { into 'META-INF' }
}
