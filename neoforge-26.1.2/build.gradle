// Adapted from the real MDK-26.1.2-ModDevGradle template (confirmed via
// your clone - plugin version 2.0.144, neo_version 26.1.2.100). Trimmed
// out the datagen/generateModMetadata templating and maven-publish blocks
// from the original template since this project doesn't need them yet -
// add them back later if you start using data generators or publishing.
// The one addition beyond the template: the dependency on :common at the
// bottom, which is what makes this a two-module project instead of the
// template's single-module layout.

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.1.2, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// The shared image assets (textures, and later a lot more) live in :common so
// a future forge-1.12.2 module can consume the same source of truth. :common
// is a plain library, so its `assets/` tree is on the classpath but is NOT
// discovered as a mod resource pack - fold it into this module's own resources
// at build time. `include 'assets/**'` keeps it from colliding with :common's
// classpath-only `horsegenetics/names/**` word tables.
// The gene pictures for the spawn egg's hover card. The wiki's icons are
// 236x210 and the card draws them 64x57, so the jar gets its own copies at
// exactly that size, written here at build time - nothing from wiki/ goes into
// the jar as it is. Nearest-neighbour on purpose: a smooth resize makes
// gradients that PNG compresses worse than the full-size originals (tried: the
// jar grew), and the GUI draws textures unfiltered anyway. `_bay.png` and
// `_sheet.png` are the bake's reference images, not icons.
def geneIconsIn = rootProject.file("wiki/assets/gene-icons")
def geneIconsOut = layout.buildDirectory.dir("generated/gene-icons")
tasks.register('shrinkGeneIcons') {
    inputs.dir(geneIconsIn)
    outputs.dir(geneIconsOut)
    doLast {
        def dir = new File(geneIconsOut.get().asFile, "assets/horsegenetics/textures/gui/gene_icons")
        dir.deleteDir()
        dir.mkdirs()
        geneIconsIn.listFiles().findAll { it.name.endsWith('.png') && !it.name.startsWith('_') }.each { f ->
            def src = javax.imageio.ImageIO.read(f)
            int w = 64
            int h = (int) Math.round(src.height * (w / (double) src.width))
            def dst = new java.awt.image.BufferedImage(w, h, java.awt.image.BufferedImage.TYPE_INT_ARGB)
            def g = dst.createGraphics()
            g.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION,
                    java.awt.RenderingHints.VALUE_INTERPOLATION_NEAREST_NEIGHBOR)
            g.drawImage(src, 0, 0, w, h, null)
            g.dispose()
            javax.imageio.ImageIO.write(dst, 'png', new File(dir, f.name))
        }
    }
}

processResources {
    from(project(":common").file("src/main/resources")) {
        include "assets/**"
    }

    dependsOn tasks.named('shrinkGeneIcons')
    from(geneIconsOut)

    // The mod version lived twice - here as `mod_version`, and again as a
    // literal in neoforge.mods.toml - and a release shipped a jar named 0.3.7
    // that told the game it was 0.3.6, because bumping one is not bumping the
    // other. Templated so gradle.properties is the only place it is written.
    // Only this one file is expanded: `expand` on the whole tree would try to
    // read every $ in every JSON as a Groovy reference.
    def props = [mod_version: project.version.toString()]
    inputs.properties(props)
    filesMatching("META-INF/neoforge.mods.toml") {
        expand(props)
    }
}

dependencies {
    implementation project(":common")
}

// A jar dropped into a real `mods/` folder must be self-contained. Gradle only
// puts :common on the classpath for the dev runs (runClient/runServer) - it is
// NOT folded into the jar by `implementation project(":common")`. Pull :common's
// compiled classes and its classpath-only resources (the horsegenetics/names/**
// word tables, which HorseRecords loads on class-init and throws without) into
// the jar here. `assets/**` is already merged by processResources above, so
// exclude it to avoid duplicate entries.
tasks.named('jar', Jar) {
    from(project(':common').sourceSets.main.output) {
        exclude 'assets/**'
        // Wiki and build tooling, not the game: the bakes that write the wiki's
        // icons, pages, fixtures and facts (every *Tool is one - nothing in the
        // game calls them), and the gene creator's example files.
        exclude '**/*Tool.class', '**/*Tool$*.class'
        exclude 'horsegenetics/example-genes/**'
    }
}
